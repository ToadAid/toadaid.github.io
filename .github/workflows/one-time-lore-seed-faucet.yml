name: One-time Aug 15 lore archive patch

on:
  push:
    branches:
      - docs/lore-2026-08-15-seed-faucet

permissions:
  contents: write

jobs:
  patch-lore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: docs/lore-2026-08-15-seed-faucet
          fetch-depth: 1

      - name: Apply bounded lore patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('lore/data.json')
          workflow = Path('.github/workflows/one-time-lore-seed-faucet.yml')
          text = path.read_text(encoding='utf-8')

          tweet_status = '2088737451598553115'
          if tweet_status not in text:
              anchor = '"id": "TOBY_T1211_CultureRealWorldBase"'
              anchor_pos = text.rfind(anchor)
              if anchor_pos < 0:
                  raise SystemExit('STOP: expected TOBY_T1211_CultureRealWorldBase anchor not found')

              old_next = '- **Next:** *Open*'
              next_pos = text.find(old_next, anchor_pos)
              if next_pos < 0:
                  raise SystemExit('STOP: expected open Next anchor after TOBY_T1211 not found')
              new_next = '- **Next:** `TOBY_T1212_IntermittentSeedFaucet`'
              text = text[:next_pos] + new_next + text[next_pos + len(old_next):]

              original = """## 🌊 Original Post

> some stayed from the first epoch.
> some wandered away from the pond.
> some have only now found the water.
>
> all toads are welcome to bond.
>
> the forge rewards those who studied early.
> those who kept their relic and lore.
>
> those who gathered leaves while the world was quiet.  time must carry weight more.
>
> but some toads arrived later.
> some could not reach the land deeds.
> some believed the world had closed without them.
>
> therefore the faucet opens intermittently.
>
> not always on and not a forever tap.
> a place for old and new toads to gather seeds.
>
> not a shortcut through the past.
> not an instant replacement for deeds.
>
> a fair beginning for those wanting to enter.
>
> early roots will always run deep.
> new seeds take time to grow.
>
> do not overreach so protect the mind to reap.
>
> there will be more paths. more phases.
> more opportunities. toadgod tries best for all.
>
> the pond remembers who stayed.
> it welcomes the fallen that return.
>
> take only what you can tend.
> infinite summers and golden crops are grown.
>
> tobyworld.app/faucet

**Timestamp:** 5:19 PM · Aug 15, 2026

---"""

              comment = """## ✨ Literal Explanation

Toadgod opens a new **intermittent SEED faucet** as an entry and re-entry path for old, new, and returning toads. The post explicitly distinguishes that path from the earlier Forge: those who studied early, kept relic and lore, and gathered leaves while the world was quiet retain the weight of that history.

The faucet is described as **intermittent** — “not always on and not a forever tap” — and as a place to gather seeds. At the same time, Toadgod states that it is **not a shortcut through the past** and **not an instant replacement for deeds**. The post therefore widens access without erasing the distinction of earlier participation or Lore Land Deeds.

**Associated live mechanism:** https://tobyworld.app/faucet

---

## 🪞 Evidence Boundary

This post directly supports the following facts:

- The faucet is intended to open intermittently rather than remain permanently available.
- Old, new, and returning/fallen toads are explicitly welcomed into a SEED-gathering path.
- Earlier study, relics, lore, leaves, and time are explicitly given continuing narrative weight.
- The faucet is explicitly **not** presented as a shortcut through earlier history or an instant replacement for Lore Land Deeds.
- Toadgod signals that more paths, phases, and opportunities are still to come.

The post does **not** define an exact time-weighting formula, a permanent faucet schedule, the eventual utility of SEED, the eventual utility or capacity of Lore Land Deeds, tenant/rental mechanics, crop-sharing economics, or a guaranteed financial yield. “Infinite summers and golden crops” is preserved as lore language rather than converted into an unstated return promise. Live faucet terms may evolve and should be archived separately when mechanically significant.

---

## 🔮 Symbolic Meaning

- **Early roots** — provenance and time that cannot be recreated merely by arriving later.
- **The faucet** — a controlled re-entry gate rather than a permanent entitlement.
- **Seeds** — a beginning that can grow, but does not erase prior epochs.
- **The fallen that return** — inclusion without rewriting history.
- **Take only what you can tend** — restraint, responsibility, and stewardship over overreach.
- **Summers and golden crops** — recurring growth imagery pointing forward while leaving the exact mechanism unresolved.

---

## 🌀 Lore Anchors

- **Previous:** `TOBY_T1211_CultureRealWorldBase`
- **Next:** *Open*

---"""

              entry = {
                  'id': 'TOBY_T1212_IntermittentSeedFaucet',
                  'date': '2026-08-15',
                  'title': 'The Intermittent SEED Faucet',
                  'original': original,
                  'comment': comment,
                  'url': 'https://x.com/i/status/2088737451598553115',
                  'img': '',
                  'tags': 'Toadgod, Tobyworld, SEED, Faucet, LoreLand, Deeds, FallenToads, ProofOfTime, Epoch, P1'
              }

              stripped = text.rstrip()
              if not stripped.endswith(']'):
                  raise SystemExit('STOP: lore/data.json does not end with JSON array terminator')
              body = stripped[:-1].rstrip()
              if not body.endswith('}'):
                  raise SystemExit('STOP: lore/data.json final entry boundary unexpected')

              rendered = json.dumps(entry, ensure_ascii=False, indent=2)
              rendered = '\n'.join('  ' + line for line in rendered.splitlines())
              text = body + ',\n' + rendered + '\n]\n'

              json.loads(text)
              path.write_text(text, encoding='utf-8')

          workflow.unlink(missing_ok=True)
          PY

      - name: Validate and commit final one-file diff
        shell: bash
        run: |
          python -m json.tool lore/data.json >/dev/null
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/data.json .github/workflows/one-time-lore-seed-faucet.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs(lore): archive Aug 15 intermittent SEED faucet"
            git push origin HEAD:docs/lore-2026-08-15-seed-faucet
          fi
