name: One-time Aug 14 pond-to-plot lore archive patch

on:
  push:
    branches:
      - docs/lore-2026-08-14-pond-to-plot-hint

permissions:
  contents: write

jobs:
  patch-lore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: docs/lore-2026-08-14-pond-to-plot-hint
          fetch-depth: 1

      - name: Apply bounded Aug 14 pond-to-plot lore patch
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('lore/data.json')
          workflow = Path('.github/workflows/one-time-lore-pond-to-plot-hint.yml')
          text = path.read_text(encoding='utf-8')

          new_id = 'TOBY_T1211A_PondToPlotHint'
          tweet_url = 'https://x.com/i/status/2088156810670678206'
          if tweet_url in text or new_id in text:
              raise SystemExit('STOP: Aug 14 pond-to-plot event already archived')

          insert_marker = '  {\n    "id": "TOBY_T1212_IntermittentSeedFaucet",'
          old_prev_next = '- **Next:** `TOBY_T1212_IntermittentSeedFaucet`'
          new_prev_next = '- **Next:** `TOBY_T1211A_PondToPlotHint`'
          old_next_prev = '- **Previous:** `TOBY_T1211_CultureRealWorldBase`'
          new_next_prev = '- **Previous:** `TOBY_T1211A_PondToPlotHint`'

          for name, needle in [
              ('T1212 insertion marker', insert_marker),
              ('T1211 next anchor', old_prev_next),
              ('T1212 previous anchor', old_next_prev),
          ]:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'STOP: expected exactly one {name}; observed {count}')

          original = '\n'.join([
              '## 🌊 Original Post',
              '',
              '> deeds lie scarce, with taboshi rare.',
              '> study the lore, the signs are there.',
              '> leafs1 relics are not forgot.',
              '> the tap will drips from pond to plot.',
              '> a world for toads who braved the cold,',
              '> and studied while the winters rolled.',
              '> @toadgod1017',
              '',
              '**Handle:** `@ahushbeforedawn`  ',
              '**Display name:** `toadgod`  ',
              '**Timestamp:** 2:52 AM · Aug 14, 2026  ',
              '**Provenance:** Backup / recovery account post explicitly pointing to `@toadgod1017`.',
              '',
              '---',
          ])

          comment = '\n'.join([
              '## ✨ Literal Explanation',
              '',
              'The authenticated backup / recovery account posts a compact Lore Land riddle one day after the main-account P1 declaration and one day before the intermittent SEED faucet post.',
              '',
              'The post directly says that **deeds lie scarce**, **TABOSHI is rare**, and **leafs1 relics are not forgot**. It then introduces the line **“the tap will drips from pond to plot”** and again tells readers to study the lore and remember those who endured the winters.',
              '',
              '---',
              '',
              '## 🪞 Retrospective Evidence Boundary',
              '',
              'This post is preserved as a **pre-mechanism hint / riddle**, not as a complete mechanical specification.',
              '',
              'Directly supported by the text:',
              '',
              '- Lore Land deeds are framed as scarce.',
              '- TABOSHI is framed as rare.',
              '- `leafs1` relics are explicitly said to be **not forgot**.',
              '- A **tap** is explicitly described as moving **from pond to plot**.',
              '- Earlier study and endurance through the winters remain part of the selection / memory language.',
              '',
              'Chronology gives the riddle additional retrospective weight: the Aug 13 main-account post says Lore Land deeds will unlock in due time and that more gates will come; the Aug 15 post then explicitly announces an **intermittent faucet** and says it is **not an instant replacement for deeds**. That sequence makes the Aug 14 word **tap** a notable foreshadowing signal.',
              '',
              'The archive does **not** convert “pond to plot” into an unstated land-yield formula, landlord / tenant system, SEED-to-land conversion rule, rental economy, capacity limit, or guaranteed return. Those remain unresolved until direct mechanics are published.',
              '',
              '---',
              '',
              '## 🔮 Symbolic Meaning',
              '',
              '- **Scarce deeds** — the forged land artifact is framed as limited rather than interchangeable.',
              '- **Rare TABOSHI** — the leaf remains consequential after the Forge opens.',
              '- **leafs1 relics are not forgot** — historical relics remain inside the memory of the system.',
              '- **Tap** — a gate hinted before the following day’s explicit faucet language.',
              '- **Pond to plot** — a directional bridge from the shared pond toward land, while the exact mechanic remains sealed.',
              '- **Winters rolled** — continuity and study through earlier periods again carry narrative weight.',
              '',
              '---',
              '',
              '## 🌀 Lore Anchors',
              '',
              '- **Previous:** `TOBY_T1211_CultureRealWorldBase`',
              '- **Next:** `TOBY_T1212_IntermittentSeedFaucet`',
              '',
              '---',
          ])

          entry = {
              'id': new_id,
              'date': '2026-08-14',
              'title': 'The Pond-to-Plot Hint',
              'original': original,
              'comment': comment,
              'url': tweet_url,
              'img': '',
              'tags': 'Toadgod, AhushBeforeDawn, Tobyworld, LoreLand, Deeds, Taboshi, Leafs1, Tap, PondToPlot, Riddle, Foreshadowing, P1'
          }

          rendered = json.dumps(entry, ensure_ascii=False, indent=2)
          rendered = '\n'.join('  ' + line for line in rendered.splitlines())

          text = text.replace(old_prev_next, new_prev_next, 1)
          text = text.replace(old_next_prev, new_next_prev, 1)
          text = text.replace(insert_marker, rendered + ',\n' + insert_marker, 1)
          path.write_text(text, encoding='utf-8')

          data = json.loads(path.read_text(encoding='utf-8'))
          ids = [item.get('id') for item in data]
          if ids.count(new_id) != 1:
              raise SystemExit('STOP: pond-to-plot event identity count is not exactly one')
          if ids[-3:] != [
              'TOBY_T1211_CultureRealWorldBase',
              'TOBY_T1211A_PondToPlotHint',
              'TOBY_T1212_IntermittentSeedFaucet',
          ]:
              raise SystemExit('STOP: final chronology binding failed')
          event = data[ids.index(new_id)]
          if event.get('url') != tweet_url:
              raise SystemExit('STOP: tweet URL binding failed')
          if '**Timestamp:** 2:52 AM · Aug 14, 2026' not in event.get('original', ''):
              raise SystemExit('STOP: timestamp binding failed')

          workflow.unlink(missing_ok=True)
          print('JSON_PARSE: PASS')
          print('CHRONOLOGY_BINDING: PASS')
          print('POND_TO_PLOT_EVENT_COUNT: 1')
          print('TWEET_URL_BINDING: PASS')
          print('TIMESTAMP_BINDING: PASS')
          PY

          git diff --check
          git diff -- lore/data.json

      - name: Commit exact lore patch and remove temporary workflow
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/data.json .github/workflows/one-time-lore-pond-to-plot-hint.yml
          if git diff --cached --quiet; then
            echo "STOP: no lore change staged"
            exit 0
          fi
          git commit -m "docs(lore): archive Aug 14 pond-to-plot hint"
          git push origin HEAD:docs/lore-2026-08-14-pond-to-plot-hint
