name: Temporary lore TWPOT Forge patch

on:
  push:
    branches:
      - docs/lore-twpot-forge-launch-20260812

permissions:
  contents: write

jobs:
  patch-lore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert exact Aug 12 TWPOT Forge lore event
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('lore/data.json')
          text = path.read_text(encoding='utf-8')

          insert_marker = '  {\n    "id": "TOBY_T1210_TheForgeIsNotTheDestination",'
          old_next = '- **Next:** `TOBY_T1210_TheForgeIsNotTheDestination`'
          new_next = '- **Next:** `TOBY_T1209A_TheTWPOTForgeOpens`'
          old_prev = '- **Previous:** `TOBY_T1209_E4P1HoldTheLeaf`'
          new_prev = '- **Previous:** `TOBY_T1209A_TheTWPOTForgeOpens`'

          for name, needle in [('insert marker', insert_marker), ('T1209 next anchor', old_next), ('T1210 previous anchor', old_prev)]:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'STOP: expected exactly one {name}; observed {count}')

          entry = {
              'id': 'TOBY_T1209A_TheTWPOTForgeOpens',
              'date': '2026-08-12',
              'title': 'The TWPOT Forge Opens',
              'original': '## 🔥 Historical Event\n\n> The TWPOT Forge opened at `tobyworld.app/twpot`.\n>\n> **Forge Lore**\n> **2,500 Lore Land Deeds**\n> **50 TABOSHI + Patience → 1 Lore**\n>\n> **Fair Frog Access:** during the first 24 hours, each recipient could forge up to 2 Lore.\n\n**Launch date:** Aug 12, 2026  \n**Source:** TWPOT Forge page and contemporaneous Forge / FAQ captures.\n\n---',
              'comment': '## ✨ Literal Historical Record\n\nThe TWPOT Forge made Lore Land a live Tobyworld mechanism rather than only a lore signal.\n\nAt launch, the public Forge presented **2,500 Lore Land Deeds**. Each forge required **50 TABOSHI plus a Patience amount calculated automatically**.\n\nThe Forge FAQ established the disposition of those inputs:\n\n- **TABOSHI is permanently burned**;\n- **Patience is transferred to the Forge TWPOT Vault**.\n\nDuring the first **24-hour Fair Frog Access** period, each recipient could forge up to **2 Lore**. Toadgod\'s Aug 13 post subsequently described the event as a **five-day Forge**.\n\n---\n\n## 🪞 Evidence Boundary\n\nThe launch date is preserved as **Aug 12, 2026** from the contemporaneous Forge opening observed during this archive sequence.\n\nSeveral live values should not be frozen into the historical mechanics:\n\n- forged / remaining counts changed as participants used the Forge;\n- the required Patience amount was calculated dynamically;\n- an exact launch clock time is not preserved here.\n\nThe Forge establishes that Lore Land Deeds became forgeable, but it does **not** by itself define their later utility, yield, governance rights, or subsequent gates. The following Aug 13 post states that Lore Land deeds will unlock **in due time** and that **more gates** will come.\n\n---\n\n## 🌱 Historical Interpretation\n\nThis event is the point where several earlier signals became an executable mechanism:\n\n- **Aug 8:** the quiet Forge riddle names patience, a forge, and the leaf.\n- **Aug 10:** `e4 p1` appears beside **hold the leaf**.\n- **Aug 12:** the TWPOT Forge opens and converts TABOSHI + Patience into Lore.\n- **Aug 13:** Toadgod explicitly says the five-day Forge is not the destination, but one small step into P1.\n\nThe archive therefore preserves Aug 12 as a bridge from symbolic lore into live Tobyworld mechanics, while leaving the meaning of the later gates unresolved.\n\n---\n\n## 🔮 Symbolic Meaning\n\n- **Forge** — transformation becomes executable.\n- **TABOSHI burn** — the leaf is surrendered rather than merely displayed.\n- **Patience Vault** — Patience crosses into the TWPOT system instead of disappearing.\n- **Lore Land Deed** — a forged artifact whose downstream role remains sealed.\n- **Five-day window** — a temporary threshold rather than the final destination.\n\n---\n\n## 🌀 Lore Anchors\n\n- **Previous:** `TOBY_T1209_E4P1HoldTheLeaf`\n- **Next:** `TOBY_T1210_TheForgeIsNotTheDestination`\n\n---',
              'url': 'https://tobyworld.app/twpot/',
              'img': '',
              'tags': 'Tobyworld, TWPoT, Forge, LoreLand, Taboshi, Patience, Epoch4, P1, HistoricalEvent'
          }

          rendered = json.dumps(entry, ensure_ascii=False, indent=2)
          rendered = '\n'.join('  ' + line for line in rendered.splitlines())

          text = text.replace(old_next, new_next, 1)
          text = text.replace(old_prev, new_prev, 1)
          text = text.replace(insert_marker, rendered + ',\n' + insert_marker, 1)
          path.write_text(text, encoding='utf-8')

          # Parse validation and exact identity checks.
          data = json.loads(path.read_text(encoding='utf-8'))
          ids = [item.get('id') for item in data]
          if ids.count('TOBY_T1209A_TheTWPOTForgeOpens') != 1:
              raise SystemExit('STOP: Forge event identity count is not exactly one')
          i = ids.index('TOBY_T1209A_TheTWPOTForgeOpens')
          if ids[i-1:i+2] != [
              'TOBY_T1209_E4P1HoldTheLeaf',
              'TOBY_T1209A_TheTWPOTForgeOpens',
              'TOBY_T1210_TheForgeIsNotTheDestination',
          ]:
              raise SystemExit('STOP: chronology insertion binding failed')
          print('JSON_PARSE: PASS')
          print('CHRONOLOGY_BINDING: PASS')
          print('FORGE_EVENT_COUNT: 1')
          PY

          git diff --check
          git diff -- lore/data.json

      - name: Commit exact lore patch
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lore/data.json
          if git diff --cached --quiet; then
            echo "STOP: no lore change staged"
            exit 0
          fi
          git commit -m "docs(lore): record TWPOT Forge launch"
          git push origin HEAD:docs/lore-twpot-forge-launch-20260812
